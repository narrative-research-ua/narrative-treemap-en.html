<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narrative map</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    color: #15212b;
    background: #f5f6f8;
    font-family: Arial, sans-serif;
}
.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 18px;
    background: white;
    border-bottom: 1px solid #e1e4e8;
}
.hint { font-size: 14px; }
.controls {
    display: flex;
    align-items: center;
    gap: 8px;
}
button {
    font: inherit;
    cursor: pointer;
    border: 1px solid #d8dde3;
    background: white;
    color: #15212b;
    border-radius: 6px;
    padding: 7px 11px;
}
button:hover { background: #f0f2f5; }
button:focus-visible {
    outline: 2px solid #3b4b8c;
    outline-offset: 3px;
}
#zoom-value {
    min-width: 48px;
    text-align: center;
    font-size: 13px;
}
.viewport {
    height: calc(100dvh - 70px);
    overflow: auto;
    padding: 14px;
}
#chart {
    width: 100%;
    background: white;
}
.tile-hit { cursor: pointer; }
.tile-hit:focus { outline: none; }
.tile-hit:hover rect,
.tile-hit:focus-visible rect {
    stroke: white;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}
dialog {
    width: min(620px, calc(100vw - 32px));
    max-height: calc(100dvh - 40px);
    overflow: auto;
    border: 0;
    border-radius: 12px;
    padding: 26px;
    color: #15212b;
    box-shadow: 0 18px 70px #0003;
    font-family: Arial, sans-serif;
}
dialog::backdrop { background: #10192380; }
.dialog-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}
#detail-kind {
    color: #596572;
    font-size: 13px;
}
#detail-title {
    font-size: 22px;
    line-height: 1.35;
    margin: 18px 0;
    overflow-wrap: anywhere;
}
.counter {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 24px;
}
.grand-label {
    color: #596572;
    font-size: 12px;
    margin-bottom: 7px;
}
#detail-grand {
    font-size: 15px;
    line-height: 1.45;
}
@media (max-width: 600px) {
    .viewport { height: calc(100dvh - 110px); }
    #detail-title { font-size: 19px; }
}
</style>

        <style id="topics-style">
        .topics-section {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e1e4e8;
        }
        .topics-section h2 {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
        }
        #detail-topics {
            margin: 0;
            padding-left: 20px;
        }
        #detail-topics li {
            margin-bottom: 10px;
            padding-left: 3px;
            font-size: 15px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }
        </style>
        
        <style id="hide-grand-details">
            .grand-label,
            #detail-grand {
                display: none;
            }
        </style>
        <style id="size-exception-style">
#detail-size-note {font-size: 14px; line-height: 1.45; margin: -8px 0 22px;}
#detail-size-note[hidden] {display: none;}
</style>

        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openDetails(Number(tile.dataset.index));
        }
    });
});

document.getElementById("close").onclick = () => modal.close();

modal.addEventListener("click", event => {
    const bounds = modal.getBoundingClientRect();
    if (
        event.target === modal &&
        (event.clientX < bounds.left || event.clientX > bounds.right ||
         event.clientY < bounds.top || event.clientY > bounds.bottom)
    ) modal.close();
});

let zoom = 1;

function setZoom(value) {
    zoom = Math.max(0.5, Math.min(4, value));
    chart.style.width = `${zoom * 100}%`;
    document.getElementById("zoom-value").textContent =
        `${Math.round(zoom * 100)}%`;
}

document.getElementById("zoom-in").onclick = () => setZoom(zoom + 0.25);
document.getElementById("zoom-out").onclick = () => setZoom(zoom - 0.25);
document.getElementById("reset").onclick = () => {
    setZoom(1);
    viewport.scrollTo({top: 0, left: 0});
};
</script>
